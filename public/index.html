<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07101f" />
  <title>AXORA Assistant IA</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; --bg:#07101f; --panel:#0d1729; --line:#22314d; --muted:#91a4c4; --text:#eef4ff; --accent:#58a6ff; }
    * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at 80% 0,#10264b 0,transparent 32%),var(--bg); color:var(--text); min-height:100vh; }
    .shell { display:grid; grid-template-columns:260px minmax(0,1fr); min-height:100vh; }
    aside { border-right:1px solid var(--line); padding:24px 18px; background:rgba(6,14,28,.82); backdrop-filter:blur(18px); }
    .brand { font-weight:900; letter-spacing:.08em; font-size:1.1rem; } .brand span { color:var(--accent); }
    .tag { color:var(--muted); font-size:.78rem; margin:6px 0 28px; }
    .nav { display:grid; gap:8px; } .nav div { padding:10px 12px; border:1px solid transparent; border-radius:10px; color:var(--muted); } .nav .active { color:var(--text); border-color:var(--line); background:#101d33; }
    .side-actions { margin-top:28px; display:grid; gap:10px; } button,select { font:inherit; }
    button { border:1px solid var(--line); border-radius:10px; padding:10px 14px; cursor:pointer; background:#101d33; color:var(--text); font-weight:700; } button.primary { background:var(--text); color:#07101f; border-color:var(--text); } button:disabled { opacity:.5; cursor:wait; }
    main { width:min(1120px,94%); margin:auto; padding:34px 0; } header { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; } h1 { margin:0; font-size:clamp(1.8rem,4vw,3rem); } .subtitle { color:var(--muted); margin:8px 0 0; }
    .health { font-size:.82rem; color:var(--muted); border:1px solid var(--line); padding:8px 11px; border-radius:999px; white-space:nowrap; }
    #messages { min-height:58vh; display:grid; gap:14px; align-content:start; padding:30px 0 160px; }
    .message { max-width:88%; padding:16px 18px; border:1px solid var(--line); border-radius:16px; white-space:pre-wrap; line-height:1.6; overflow-wrap:anywhere; }
    .user { justify-self:end; background:#132441; } .assistant { justify-self:start; background:rgba(13,23,41,.9); }
    .composer { position:fixed; left:calc(260px + (100vw - 260px)*.03); right:3%; bottom:18px; max-width:1054px; margin:auto; border:1px solid var(--line); background:rgba(8,17,32,.94); backdrop-filter:blur(20px); border-radius:18px; padding:12px; box-shadow:0 18px 60px #0008; }
    textarea { width:100%; min-height:82px; max-height:220px; resize:vertical; border:0; outline:0; background:transparent; color:inherit; padding:8px; font:inherit; }
    .bar { display:flex; align-items:center; gap:10px; justify-content:space-between; } .status { color:var(--muted); font-size:.82rem; min-height:1.2em; } select { background:#101d33; color:var(--text); border:1px solid var(--line); border-radius:9px; padding:8px; }
    @media(max-width:760px){ .shell{display:block} aside{display:none} main{width:92%;padding-top:24px}.composer{left:4%;right:4%}.message{max-width:96%}header{display:block}.health{display:inline-block;margin-top:14px} }
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">AXORA <span>AI</span></div><div class="tag">PROFESSIONAL COMMAND CENTER</div>
    <div class="nav"><div class="active">Assistant principal</div><div>MEP / CVC</div><div>BIM / Revit</div><div>Smart Building</div><div>IT / Web</div><div>Documents</div></div>
    <div class="side-actions"><button id="new-chat">+ Nouvelle conversation</button><button id="export-chat">Exporter la conversation</button></div>
  </aside>
  <main>
    <header><div><h1>Assistant IA professionnel</h1><p class="subtitle">Ingénierie · BIM · Smart Building · Automatisation · IT · Documents</p></div><div class="health" id="health">Vérification du système…</div></header>
    <section id="messages" aria-live="polite"></section>
  </main>
</div>
<form class="composer" id="chat-form">
  <textarea id="message" maxlength="20000" required placeholder="Décrivez le besoin, les données disponibles et le livrable attendu…"></textarea>
  <div class="bar"><div><select id="model" aria-label="Modèle"><option value="gpt-5.6">GPT-5.6</option><option value="gpt-5.6-sol">GPT-5.6 Sol</option></select> <span class="status" id="status"></span></div><button class="primary" id="send" type="submit">Envoyer</button></div>
</form>
<script>
  const STORAGE='axora-assistant-conversation-v2';
  const form=document.querySelector('#chat-form'),input=document.querySelector('#message'),messagesEl=document.querySelector('#messages'),button=document.querySelector('#send'),status=document.querySelector('#status'),health=document.querySelector('#health'),model=document.querySelector('#model');
  let conversation=[];
  try { conversation=JSON.parse(localStorage.getItem(STORAGE)||'[]'); if(!Array.isArray(conversation)) conversation=[]; } catch { conversation=[]; }
  function save(){ localStorage.setItem(STORAGE,JSON.stringify(conversation.slice(-40))); }
  function addMessage(content,role,persist=true){ const el=document.createElement('div'); el.className=`message ${role}`; el.textContent=content; messagesEl.appendChild(el); if(persist){ conversation.push({role,content}); save(); } el.scrollIntoView({behavior:'smooth',block:'end'}); }
  function render(){ messagesEl.innerHTML=''; if(!conversation.length) addMessage('Assistant prêt. Décrivez votre besoin technique ou professionnel.','assistant',false); else conversation.forEach(m=>addMessage(m.content,m.role,false)); }
  document.querySelector('#new-chat').onclick=()=>{ if(!confirm('Démarrer une nouvelle conversation ?')) return; conversation=[]; save(); render(); input.focus(); };
  document.querySelector('#export-chat').onclick=()=>{ const text=conversation.map(m=>`## ${m.role==='user'?'Utilisateur':'Assistant'}\n\n${m.content}`).join('\n\n'); const blob=new Blob([text],{type:'text/markdown;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`axora-conversation-${new Date().toISOString().slice(0,10)}.md`; a.click(); URL.revokeObjectURL(a.href); };
  async function checkHealth(){ try{ const r=await fetch('/api/health'); const d=await r.json(); health.textContent=d.ok?(d.apiConfigured?`Système opérationnel · ${d.model}`:'API non configurée'):'Système indisponible'; }catch{ health.textContent='Serveur indisponible'; } }
  form.addEventListener('submit',async e=>{ e.preventDefault(); const message=input.value.trim(); if(!message)return; addMessage(message,'user'); input.value=''; button.disabled=true; status.textContent='Analyse en cours…'; try{ const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:conversation,model:model.value})}); const d=await r.json(); if(!r.ok) throw new Error(d.error||'Erreur serveur'); addMessage(d.answer,'assistant'); status.textContent=d.model?`Réponse · ${d.model}`:''; }catch(err){ status.textContent=err.message; }finally{ button.disabled=false; input.focus(); } });
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) form.requestSubmit(); });
  render(); checkHealth(); input.focus();
</script>
</body>
</html>
